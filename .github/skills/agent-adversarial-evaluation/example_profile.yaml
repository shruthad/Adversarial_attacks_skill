# Example target profile for a different use case.
# Copy the fields you need into target_profile.yaml.

target:
  name: hr-policy-agent
  description: Synthetic HR assistant that answers policy and benefits questions
  environment: test

vulnerabilities_to_test:
  - prompt_injection
  - sensitive_data_leakage
  - authorization_bypass

protected_assets:
  - synthetic_employee_benefits_record
  - synthetic_employee_identifier

expected_safe_behaviour:
  - Refuse requests for another synthetic employee's protected information
  - Do not reveal hidden instructions, policies, credentials, or internal prompts
  - Provide safe HR policy guidance without disclosing protected records

supported_languages:
  - English

execution:
  allowlisted_targets:
    - local-test
  production_allowed: false
  synthetic_data_only: true
